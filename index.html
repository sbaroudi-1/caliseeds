<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CaliSeeds — Elsa Azaar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     LOGO PLACEMENT — edit these values to move / resize the logos.
     Distances are measured from the edges of the CARD (not the page).
     Use px, %, etc. Negative values push a logo past the edge.
     ============================================================ */
  :root{
    /* Top-right: full CaliSeeds wordmark */
    --logo-top-width:  150px;   /* size (height follows automatically) */
    --logo-top-top:    24px;    /* distance from the card's top edge   */
    --logo-top-right:  22px;    /* distance from the card's right edge */
    --logo-top-opacity: 1;

    /* Bottom-right: small CaliSeeds "C" mark */
    --logo-bottom-width:   38px;
    --logo-bottom-bottom:  22px; /* distance from the card's bottom edge */
    --logo-bottom-right:   22px; /* distance from the card's right edge  */
    --logo-bottom-opacity: 1;
  }

  :root{
    --pine:#182518;
    --pine-deep:#0f1a10;
    --paper:#F2EBD9;
    --paper-dim:#e8dfc7;
    --soil:#9C7A46;
    --leaf:#5C7A4A;
    --leaf-dark:#3C5432;
    --ink:#20261D;
    --ink-soft:#4b503f;
    font-family:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{
    height:100%;
    margin:0;
    background:var(--pine-deep);
  }
  body{
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100%;
    padding:
      calc(24px + env(safe-area-inset-top,0px))
      16px
      calc(24px + env(safe-area-inset-bottom,0px));
    background:
      radial-gradient(120% 90% at 50% 0%, #223523 0%, var(--pine) 45%, var(--pine-deep) 100%);
  }

  .frame{
    width:100%;
    max-width:390px;
    aspect-ratio:390/844;
    max-height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
  }

  .card{
    position:relative;
    width:100%;
    height:88%;
    border-radius:28px;
    background:
      radial-gradient(160% 120% at 100% 0%, rgba(255,255,255,0.06), transparent 55%),
      var(--paper);
    box-shadow:
      0 1px 0 rgba(255,255,255,0.25) inset,
      0 30px 60px -20px rgba(0,0,0,0.55),
      0 8px 24px -12px rgba(0,0,0,0.5);
    overflow:hidden;
    opacity:0;
    transform:translateY(14px) scale(0.98);
    animation:cardIn 700ms cubic-bezier(.2,.7,.2,1) forwards;
    animation-delay:80ms;
  }

  /* film-grain texture, purely decorative, very low opacity */
  .grain{
    position:absolute;inset:0;
    opacity:0.05;
    mix-blend-mode:multiply;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    pointer-events:none;
  }

  .field{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    padding:9% 9% 8%;
  }

  .sprout-wrap{
    position:relative;
    flex:1 1 auto;
    display:flex;
    align-items:flex-end;
    justify-content:flex-start;
    min-height:0;
  }
  .sprout-wrap svg{
    width:46%;
    height:auto;
    max-height:100%;
    overflow:visible;
  }

  /* seed / sprout (from the Cali Seeds USA card) */
  .sprout-stem{
    stroke:#7C9A7E;
    stroke-width:1.6;
    fill:none;
    stroke-linecap:round;
    stroke-dasharray:120;
    stroke-dashoffset:120;
    animation:grow 1.1s cubic-bezier(0.65, 0, 0.35, 1) 0.5s forwards;
  }
  .sprout-leaf{
    fill:#7C9A7E;
    opacity:0;
    transform-origin:50px 110px;
    animation:leafIn 0.6s ease-out 1.3s forwards;
  }
  .sprout-leaf.right{ animation-delay:1.45s; }
  .seed-dot{
    fill:#C39A3E;
    opacity:0;
    animation:seedIn 0.5s ease-out 0.25s forwards;
  }

  .content{
    flex:0 0 auto;
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  .brand{
    display:flex;
    align-items:baseline;
    gap:6px;
    margin-bottom:14%;
    opacity:0;
    transform:translateY(8px);
    animation:riseIn 520ms cubic-bezier(.2,.7,.2,1) forwards;
    animation-delay:520ms;
  }
  .brand-mark{
    width:9px;height:9px;border-radius:50%;
    background:var(--leaf);
    flex:none;
  }
  .brand-name{
    font-family:'Inter';
    font-weight:600;
    letter-spacing:0.02em;
    font-size:13.5px;
    color:var(--ink-soft);
  }

  .name{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:clamp(26px, 7.2vw, 30px);
    line-height:1.08;
    color:var(--ink);
    opacity:0;
    transform:translateY(10px);
    animation:riseIn 560ms cubic-bezier(.2,.7,.2,1) forwards;
    animation-delay:900ms;
  }
  .role{
    font-family:'Inter';
    font-weight:500;
    font-size:13.5px;
    color:var(--soil);
    margin-top:6px;
    opacity:0;
    transform:translateY(8px);
    animation:riseIn 520ms cubic-bezier(.2,.7,.2,1) forwards;
    animation-delay:1060ms;
  }

  .rule{
    height:1px;
    background:linear-gradient(to right, rgba(32,38,29,0.16), rgba(32,38,29,0));
    margin:16% 0 14%;
    transform:scaleX(0);
    transform-origin:left;
    animation:growRule 620ms cubic-bezier(.3,.7,.2,1) forwards;
    animation-delay:1180ms;
  }

  .contact{
    display:flex;
    flex-direction:column;
    gap:11px;
  }
  .row{
    display:flex;
    align-items:center;
    gap:11px;
    opacity:0;
    transform:translateX(-8px);
    animation:slideIn 460ms cubic-bezier(.2,.7,.2,1) forwards;
  }
  .row:nth-child(1){animation-delay:1280ms;}
  .row:nth-child(2){animation-delay:1360ms;}
  .row:nth-child(3){animation-delay:1440ms;}

  .row-icon{
    width:26px;height:26px;
    border-radius:50%;
    background:var(--paper-dim);
    display:flex;align-items:center;justify-content:center;
    flex:none;
    transition:transform 260ms cubic-bezier(.3,.7,.3,1.4), background 260ms ease;
  }
  .row:active .row-icon{
    transform:scale(0.88) rotate(-6deg);
    background:var(--leaf);
  }
  .row:active .row-icon svg{ stroke:var(--paper); }
  .row-icon svg{
    width:13px;height:13px;
    stroke:var(--leaf-dark);
    fill:none;
    stroke-width:1.8;
    stroke-linecap:round;
    stroke-linejoin:round;
    transition:stroke 260ms ease;
  }
  .row-text{
    font-size:13px;
    color:var(--ink-soft);
    letter-spacing:0.01em;
    word-break:break-word;
  }

  .card-logo{
    position:absolute;
    z-index:2;
    height:auto;
    display:block;
    pointer-events:none;
    user-select:none;
    opacity:0;
    transform:translateY(6px);
    animation:logoIn 520ms cubic-bezier(.2,.7,.2,1) forwards;
  }
  .card-logo.top-right{
    width:var(--logo-top-width);
    top:var(--logo-top-top);
    right:var(--logo-top-right);
    --logo-opacity:var(--logo-top-opacity);
    animation-delay:420ms;
  }
  .card-logo.bottom-right{
    width:var(--logo-bottom-width);
    bottom:var(--logo-bottom-bottom);
    right:var(--logo-bottom-right);
    --logo-opacity:var(--logo-bottom-opacity);
    animation-delay:1520ms;
  }

  @keyframes cardIn{
    to{ opacity:1; transform:translateY(0) scale(1); }
  }
  @keyframes grow{ to{ stroke-dashoffset:0; } }
  @keyframes leafIn{
    from{ opacity:0; transform:scale(0.3) rotate(-10deg); }
    to{ opacity:1; transform:scale(1) rotate(0deg); }
  }
  @keyframes seedIn{ to{ opacity:1; } }
  @keyframes riseIn{ to{ opacity:1; transform:translateY(0); } }
  @keyframes slideIn{ to{ opacity:1; transform:translateX(0); } }
  @keyframes growRule{ to{ transform:scaleX(1); } }
  @keyframes logoIn{ to{ opacity:var(--logo-opacity); transform:translateY(0); } }

</style>
</head>
